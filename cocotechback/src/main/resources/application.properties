spring.application.name=cocotechback

# ===== MySQL (fuente de verdad transaccional) =====
spring.datasource.url=jdbc:mysql://localhost:3306/cocotech?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=CAMBIAR_PASSWORD_AQUI
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# ===== MongoDB (vista de lectura intensiva + reportes computados) =====
spring.data.mongodb.uri=mongodb://localhost:27017/cocotech_reports
spring.data.mongodb.auto-index-creation=true

# Si usas MongoDB Atlas (nube), reemplaza la URI por:
# spring.data.mongodb.uri=mongodb+srv://usuario:password@cluster.mongodb.net/cocotech_reports?retryWrites=true&w=majority

# ===== JWT =====
jwt.secret=CAMBIAR_ESTE_SECRETO_POR_UNO_LARGO_Y_ALEATORIO_EN_PRODUCCION
jwt.expiration=86400000

# ===== Servidor =====
server.port=8080
server.servlet.context-path=/api

# ===== Logging =====
logging.level.co.edu.unbosque.cocotechback=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.hibernate.SQL=WARN

